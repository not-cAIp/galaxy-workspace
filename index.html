<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GALAXY WORKSPACE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#f3f4f7; --surface:#ffffff; --surface-2:#eef0f4;
    --ink:#1c2230; --ink-soft:#5b6272; --ink-faint:#9aa1b0;
    --line:#e0e2e8; --accent:#3a5bd9; --accent-soft:#e8edfc;
    --warn:#c6501f; --warn-soft:#fbeee5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:"Inter","Noto Sans SC",system-ui,sans-serif;
  }
  .mono{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;}
  header{
    background:var(--surface); border-bottom:1px solid var(--line);
    padding:14px 20px; display:flex; align-items:center; gap:10px;
    position:sticky; top:0; z-index:5;
  }
  header .mark{
    width:26px;height:26px;border-radius:6px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;
  }
  header .word{font-weight:700;font-size:14.5px;letter-spacing:.02em;}
  header .sub{font-size:11.5px;color:var(--ink-faint);margin-left:4px;}
  #app{max-width:760px;margin:0 auto;padding:20px 16px 60px;}
  .crumbs{font-size:12.5px;color:var(--ink-faint);margin-bottom:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .crumbs b{color:var(--ink);font-weight:600;}
  .crumbs span.seg{cursor:pointer;}
  .crumbs span.seg:hover{color:var(--accent);}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .panel + .panel{margin-top:14px;}
  .row{
    display:flex; align-items:center; gap:12px; padding:12px 16px;
    border-bottom:1px solid var(--line); cursor:pointer;
  }
  .row:last-child{border-bottom:none;}
  .row:hover{background:var(--surface-2);}
  .row.locked{cursor:default;opacity:.65;}
  .row.locked:hover{background:none;}
  .row .ic{
    width:34px;height:34px;border-radius:8px;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:15px;
    background:var(--accent-soft);color:var(--accent);
  }
  .row .ic.file{background:var(--surface-2);color:var(--ink-soft);}
  .row .meta{flex:1;min-width:0;}
  .row .name{font-size:13.5px;font-weight:500;color:var(--ink);}
  .row .sub2{font-size:11px;color:var(--ink-faint);margin-top:1px;}
  .row .chev{color:var(--ink-faint);font-size:12px;}
  .doc-view{padding:20px;}
  .doc-view .dtitle{font-size:14.5px;font-weight:600;margin-bottom:2px;}
  .doc-view .dmeta{font-size:11.5px;color:var(--ink-faint);margin-bottom:16px;}
  .doc-body{
    background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
    padding:16px 18px; font-size:13px; line-height:1.9; color:var(--ink);
    white-space:pre-wrap;
  }
  .doc-body.mono{font-family:"JetBrains Mono",monospace;font-size:12.5px;}
  .diff-old{background:#fdeceb;border:1px solid #f3c5c0;border-radius:8px;padding:14px 16px;font-size:13px;line-height:1.8;margin-bottom:10px;}
  .diff-new{background:#eaf7ee;border:1px solid #bfe6cc;border-radius:8px;padding:14px 16px;font-size:13px;line-height:1.8;}
  .diff-label{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--ink-faint);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
  .back-row{margin-top:16px;font-size:12.5px;color:var(--accent);cursor:pointer;}
  .back-row:hover{text-decoration:underline;}
  .found-tag{
    display:inline-flex;align-items:center;gap:5px;margin-top:14px;
    font-size:11px;color:var(--accent);background:var(--accent-soft);
    border-radius:100px;padding:3px 10px;font-family:"JetBrains Mono",monospace;
  }
  .notice{
    background:var(--warn-soft); border:1px solid #f0cdb4; color:var(--warn);
    border-radius:8px; padding:10px 14px; font-size:12px; margin-bottom:14px; line-height:1.6;
  }
  .return-panel{
    margin-top:20px; padding:16px; background:var(--surface); border:1px solid var(--line);
    border-radius:10px; text-align:center;
  }
  .return-panel a{color:var(--accent);font-size:13px;text-decoration:none;font-weight:600;}
  .return-panel a:hover{text-decoration:underline;}
  .return-panel p{font-size:11.5px;color:var(--ink-faint);margin:0 0 10px;}
  .history-toggle{margin-top:12px;font-size:12.5px;color:var(--accent);cursor:pointer;}
  .history-toggle:hover{text-decoration:underline;}

  .gate-wrap{max-width:360px;margin:40px auto 0;padding:0 16px;}
  .gate-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;}
  .gate-card h2{font-size:14.5px;margin:0 0 6px;}
  .gate-card p{font-size:12px;color:var(--ink-soft);line-height:1.7;margin:0 0 16px;}
  .gate-card label{display:block;font-size:11px;color:var(--ink-faint);font-weight:600;margin:0 0 5px;letter-spacing:.02em;}
  .gate-card input{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
    font-size:13px;color:var(--ink);margin-bottom:12px;background:var(--surface-2);
    font-family:"JetBrains Mono",monospace;box-sizing:border-box;
  }
  .gate-card input:focus{outline:none;border-color:var(--accent);}
  .gate-card button{
    width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;
    padding:11px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .gate-card button:hover{opacity:.9;}
  .gate-err{font-size:11.5px;color:var(--warn);margin-top:10px;}
  .gate-hint{font-size:11px;color:var(--ink-faint);margin-top:10px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:9px 11px;}
  [hidden]{display:none!important;}
</style>
</head>
<body>
<header>
  <div class="mark">G</div>
  <div class="word">GALAXY WORKSPACE</div>
  <div class="sub">共享文件 · 访客模式</div>
</header>

<div class="gate-wrap" id="gate-wrap">
  <div class="gate-card">
    <h2>安全验证</h2>
    <p>系统检测到这是一次外部分享访问。为保护客户隐私，请输入本次分享链接的访问口令后继续。</p>
    <label>访问口令</label>
    <input id="gate-input" type="text" placeholder="……" autocomplete="off" />
    <button id="gate-btn">验证并继续</button>
    <div id="gate-msg"></div>
  </div>
</div>

<div id="app" hidden></div>

<script>
  // 有些输入法手动打字时会把字母数字打成全角，肉眼几乎看不出来，但和
  // 半角字符串直接比较会判定不相等——粘贴进来的内容不受输入法影响所以
  // 能通过，手打却总是提示"不正确"。所有口令/答案校验都先转回半角。
  function toHalfWidth(s) {
    return s.replace(/[！-～]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/　/g, " ");
  }
  function normalizeAnswer(s) {
    return toHalfWidth(s).trim().toLowerCase().replace(/[\s@._-]/g, "");
  }

  // 4 个 F 文件全部打开后，06_安保 才会在列表里真正可点开——之前只是
  // 显示一个带锁图标的占位行，点了也没有任何反馈的死按钮不如不做。
  const F_DOCS = ["f02", "f03", "f04", "f05"];
  const openedF = new Set(JSON.parse(sessionStorage.getItem("gw-f-opened") || "[]"));
  // F05 / A01 的"查看历史版本"是否已经点开过。
  const revealed = new Set(JSON.parse(sessionStorage.getItem("gw-revealed") || "[]"));
  // f04 单独锁了一层，答案是苏昭的账号名，跟站点整体的口令不是一回事。
  const unlockedFiles = new Set(JSON.parse(sessionStorage.getItem("gw-unlocked-files") || "[]"));

  function markFOpened(id) {
    if (!openedF.has(id)) {
      openedF.add(id);
      sessionStorage.setItem("gw-f-opened", JSON.stringify([...openedF]));
    }
  }
  function markRevealed(id) {
    revealed.add(id);
    sessionStorage.setItem("gw-revealed", JSON.stringify([...revealed]));
  }

  const TREE = {
    "陈屿_经纪人文件夹": {
      type: "folder",
      children: {
        "F01_周林争吵_现场录音.m4a": { type: "file", doc: "f02" },
        "F02_林安_旧平台风险备注.txt": { type: "file", doc: "f03" },
        "F03_艺人关系风险评估_2019.txt": { type: "file", doc: "f04", locked: true },
        "F04_周年企划权限交接.txt": { type: "file", doc: "f05" },
      }
    },
    "06_安保": {
      type: "folder",
      gated: true,
      // 陈屿文件夹全部打开后还不能直接进——这一层是单独的内部口令，
      // 答案是团体出道前用过的队名，得先登进 ECHO 才能拼出来，跟 F03
      // 那道"苏昭账号名"的锁是同一种设计思路。
      folderPassword: ["nov5", "nov 5", "nov-5"],
      children: {
        "A01_员工通道记录.txt": { type: "file", doc: "a01" },
        "A02_楼栋安保巡查照片.jpg": { type: "file", doc: "a02" },
        "A03_监控维修申请.txt": { type: "file", doc: "a03" },
      }
    }
  };
  const unlockedFolders = new Set(JSON.parse(sessionStorage.getItem("gw-unlocked-folders") || "[]"));

  const DOCS = {
    f02: {
      title: "周林争吵_现场录音.m4a",
      meta: "现场备用录音 · 22:36 前后",
      body: "（文字转录，音质一般，部分字词无法确认）\n\n林安：你让他们把那段放回去。\n周晏星：放回什么？一个没出道的人？\n林安：ECHO那个群还在，所有人说过什么都在。\n周晏星：那你就登进去看看。你连密码都不一定记得。\n\n（后面被脚步声打断，没有更多内容）",
    },
    f03: {
      title: "林安_旧平台风险备注.txt",
      meta: "最后编辑 2021-03 · 舆情组存档",
      body: "平台：ECHO\n旧账号尾号：_716\n状态：长期未登录\n备注：出道前的群聊记录如果还在，不排除仍可访问，建议持续观察，暂不处理。",
    },
    f04: {
      title: "艺人关系风险评估_2019.txt",
      meta: "2019 归档 · 经手人：陈屿",
      body: "对象：周晏星／Z女士\n经纪执行确认：双方自练习生阶段起存在稳定私人关系。\n商业评估：周晏星当前人气测试、镜头反馈与品牌意向显著高于同组候选人。\n处理建议：不调整出道位，不启动纪律处分；对外按『无确证／私生联想』处理。\n经手人：陈屿",
      key: true,
      clue: "c37",
      lockQuestion: "那个女人的网名？",
      lockAnswers: ["拾光の猫", "拾光的猫", "拾光猫", "拾光", "shiguangneko"],
    },
    f05: {
      title: "周年企划权限交接.txt",
      meta: "最后编辑 09-12 16:20 · 项目组",
      body: "项目：《晏星的七年留言》\n素材执行：新_PROD\n权限：Bubble 公开发送内容导出\n禁止访问：私人同步区、隐藏迁移存档",
      historyId: "f05",
      historyLabel: "查看导出记录历史版本",
      historyClue: "c38",
      historyBody: "09-12 16:20｜新_PROD｜获得临时导出权限\n09-12 17:04｜新_PROD｜导出公开周年消息\n\n【历史版本，02:21 之后被本人尝试删除，仅存缓存】\n09-12 17:12｜新_PROD｜查看私人消息预览：『周年活动结束以后，我们能不能重新开始？』\n09-12 17:19｜新_PROD｜搜索联系人备注『昭』\n09-12 17:23｜新_PROD｜下载 2018–2019 迁移存档\n09-14 02:21｜新_PROD｜尝试删除访问历史",
    },
    a01: {
      title: "员工通道记录.txt",
      meta: "住所大厦门禁系统导出 · 当前版本",
      body: "23:20｜陈屿车辆离场\n00:27｜物业接到报警",
      historyId: "a01",
      historyLabel: "查看历史版本",
      historyClue: "c39",
      historyBody: "23:20｜陈屿车辆离场\n\n【历史版本，02:14 由 新_PROD 编辑，删除下列 2 行】\n23:46｜住所员工通道｜新_PROD｜验证成功\n00:11｜住所地下车库｜新_PROD｜手动放行\n\n00:27｜物业接到报警",
    },
    a02: {
      title: "楼栋安保巡查照片.jpg",
      meta: "00:02 拍摄 · 楼栋安保组内部留存",
      image: true,
      imageNote: "照片时间戳 00:02，画面里只拍到一件黑色工作外套经过住所楼栋的地下通道，没有拍到脸。",
      key: true,
      clue: "c40",
    },
    a03: {
      title: "监控维修申请.txt",
      meta: "申请人：新_PROD",
      body: "申请人：新_PROD\n区域：住所大厦员工通道至地下车库\n维修窗口：09-13 22:00 至 09-14 06:00\n\n（该区域监控在此窗口内不可用，属常规报修。住所大厦安保由银河星途统一外包管理，门禁系统与公司其他物业共用同一套记录后台，所以陈屿和 新_PROD 这类持有工作权限的员工都能查到住所这边的通行记录。）",
    },
  };

  function render(path) {
    const app = document.getElementById("app");
    let node = TREE;
    let crumbs = [];
    for (const seg of path) {
      crumbs.push(seg);
      node = node[seg] ? node[seg] : (node.children ? node.children[seg] : null);
    }

    if (!path.length) {
      app.innerHTML = `
        <div class="notice">这是一个未授权访问的公开分享链接。内容可能已过期或部分不可用。</div>
        <div class="crumbs"><b>共享文件</b></div>
        <div class="panel" id="listing"></div>
      `;
      renderListing(app.querySelector("#listing"), TREE, []);
      return;
    }

    if (node && node.gated && !F_DOCS.every((d) => openedF.has(d))) {
      app.innerHTML = `
        <div class="crumbs" id="crumbs"></div>
        <div class="panel doc-view">
          <div class="dtitle">🔒 06_安保</div>
          <div class="doc-body">这个文件夹暂不可访问。把陈屿经纪人文件夹里的文件都看完，再回来试试。</div>
        </div>
      `;
      renderCrumbs(app.querySelector("#crumbs"), path);
      return;
    }

    if (node && node.gated && node.folderPassword && !unlockedFolders.has(path[path.length - 1])) {
      app.innerHTML = `
        <div class="crumbs" id="crumbs"></div>
        <div class="panel doc-view" id="docview"></div>
      `;
      renderCrumbs(app.querySelector("#crumbs"), path);
      renderFolderGate(app.querySelector("#docview"), node, path);
      return;
    }

    if (node && node.type === "folder") {
      app.innerHTML = `
        <div class="crumbs" id="crumbs"></div>
        <div class="panel" id="listing"></div>
      `;
      renderCrumbs(app.querySelector("#crumbs"), path);
      renderListing(app.querySelector("#listing"), node, path);
      return;
    }

    if (node && node.type === "file") {
      const doc = DOCS[node.doc];
      app.innerHTML = `
        <div class="crumbs" id="crumbs"></div>
        <div class="panel doc-view" id="docview"></div>
      `;
      renderCrumbs(app.querySelector("#crumbs"), path);

      if (node.locked && !unlockedFiles.has(node.doc)) {
        renderFileGate(app.querySelector("#docview"), doc, node);
        return;
      }

      markFOpened(node.doc);
      renderDoc(app.querySelector("#docview"), doc, node);
    }
  }

  // 这份文件的解锁口令跟站点整体的『安全验证』不是一回事——单独锁了
  // 一层，答案是苏昭的账号名，玩家得先自己在别处找到这个账号才知道
  // 要填什么。
  function renderFileGate(el, doc, node) {
    el.innerHTML = `
      <div class="dtitle">${doc.title}</div>
      <div class="dmeta">此文件已加密，需要单独验证</div>
      <div class="gate-card" style="padding:18px;">
        <p style="margin:0 0 14px;">${escapeHtml(doc.lockQuestion || "请输入访问密钥")}</p>
        <input id="file-gate-input" type="text" placeholder="……" autocomplete="off" style="margin-bottom:10px;" />
        <button id="file-gate-btn">验证并查看</button>
        <div id="file-gate-msg"></div>
      </div>
    `;
    const input = el.querySelector("#file-gate-input");
    const msg = el.querySelector("#file-gate-msg");
    function tryFileUnlock() {
      const val = normalizeAnswer(input.value);
      const accepted = (doc.lockAnswers || []).map(normalizeAnswer);
      if (accepted.includes(val)) {
        unlockedFiles.add(node.doc);
        sessionStorage.setItem("gw-unlocked-files", JSON.stringify([...unlockedFiles]));
        markFOpened(node.doc);
        renderDoc(el, doc, node);
        return;
      }
      msg.innerHTML = `<div class="gate-err">不正确。</div>`;
    }
    el.querySelector("#file-gate-btn").addEventListener("click", tryFileUnlock);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") tryFileUnlock(); });
  }

  // 06_安保这一层的内部口令，跟陈屿文件夹的解锁条件（F01-F04全部打开）
  // 是两回事——答案是团体出道前的队名，要先登进 ECHO 才能拼出来。
  function renderFolderGate(el, node, path) {
    const folderName = path[path.length - 1];
    el.innerHTML = `
      <div class="dtitle">🔒 ${folderName}</div>
      <div class="dmeta">这个文件夹需要额外的内部口令</div>
      <div class="gate-card" style="padding:18px;">
        <p style="margin:0 0 14px;">内部口令？</p>
        <input id="folder-gate-input" type="text" placeholder="……" autocomplete="off" style="margin-bottom:10px;" />
        <button id="folder-gate-btn">验证并进入</button>
        <div id="folder-gate-msg"></div>
      </div>
    `;
    const input = el.querySelector("#folder-gate-input");
    const msg = el.querySelector("#folder-gate-msg");
    function tryFolderUnlock() {
      const val = normalizeAnswer(input.value);
      const accepted = (node.folderPassword || []).map(normalizeAnswer);
      if (accepted.includes(val)) {
        unlockedFolders.add(folderName);
        sessionStorage.setItem("gw-unlocked-folders", JSON.stringify([...unlockedFolders]));
        render(path);
        return;
      }
      msg.innerHTML = `<div class="gate-err">不正确。</div>`;
    }
    el.querySelector("#folder-gate-btn").addEventListener("click", tryFolderUnlock);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") tryFolderUnlock(); });
  }

  function renderCrumbs(el, path) {
    el.innerHTML = `<span class="seg" data-idx="-1"><b>共享文件</b></span>` +
      path.map((seg, i) => ` / <span class="seg" data-idx="${i}">${seg}</span>`).join("");
    el.querySelectorAll(".seg").forEach((s) => {
      s.addEventListener("click", () => {
        const idx = parseInt(s.dataset.idx, 10);
        render(idx < 0 ? [] : path.slice(0, idx + 1));
      });
    });
  }

  function renderListing(el, node, path) {
    const children = node.children || node;
    const entries = Object.entries(children);
    el.innerHTML = entries.map(([name, n]) => {
      const gatedLocked = n.gated && !F_DOCS.every((d) => openedF.has(d));
      const fileLocked = n.type === "file" && n.locked && !unlockedFiles.has(n.doc);
      const icon = n.type === "folder" ? (gatedLocked ? "🔒" : "📁") : (fileLocked ? "🔒" : "📄");
      const sub2 = n.type === "folder"
        ? (gatedLocked ? "尚未解锁 · 先看完经纪人文件夹" : "文件夹")
        : (fileLocked ? "已加密" : (DOCS[n.doc]?.meta || ""));
      return `
      <div class="row ${gatedLocked ? "locked" : ""}" data-name="${name}">
        <div class="ic ${n.type === "file" ? "file" : ""}">${icon}</div>
        <div class="meta">
          <div class="name">${name}</div>
          <div class="sub2">${sub2}</div>
        </div>
        <div class="chev">${gatedLocked ? "" : "›"}</div>
      </div>
    `;
    }).join("");
    el.querySelectorAll(".row").forEach((r) => {
      r.addEventListener("click", () => render([...path, r.dataset.name]));
    });
  }

  function renderDoc(el, doc, node) {
    if (!doc) { el.innerHTML = "文件不存在或已被移除。"; return; }
    let bodyHtml = "";
    if (doc.image) {
      bodyHtml = `<div class="doc-body" style="text-align:center;color:var(--ink-faint);">🖼 图片预览不可用（访客模式）${doc.imageNote ? `<div style="margin-top:8px;font-size:12px;">${escapeHtml(doc.imageNote)}</div>` : ""}</div>`;
    } else {
      bodyHtml = `<div class="doc-body">${escapeHtml(doc.body || "")}</div>`;
    }
    el.innerHTML = `
      <div class="dtitle">${doc.title}</div>
      <div class="dmeta">${doc.meta}</div>
      ${bodyHtml}
      ${doc.historyId ? `<div id="hist-slot"></div>` : ""}
    `;
    if (doc.historyId) {
      renderHistoryToggle(el.querySelector("#hist-slot"), doc);
    }
  }

  function renderHistoryToggle(el, doc) {
    if (revealed.has(doc.historyId)) {
      el.innerHTML = `<div class="doc-body mono" style="margin-top:10px;">${escapeHtml(doc.historyBody)}</div>`;
      return;
    }
    el.innerHTML = `<div class="history-toggle">‹ ${doc.historyLabel}</div>`;
    el.querySelector(".history-toggle").addEventListener("click", () => {
      markRevealed(doc.historyId);
      renderHistoryToggle(el, doc);
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  // 访问口令：命名规律是『日期 + run』。"陪你走到最后"在私信里只会
  // 把这个口令原样说出来，链接本身不带参数——口令必须由玩家自己手动
  // 输进下面这个框才会解锁，不会有任何途径跳过这一步直接进站。
  const CODE = "0913run";
  let gateAttempts = 0;
  const gateWrap = document.getElementById("gate-wrap");
  const app = document.getElementById("app");
  const gateInput = document.getElementById("gate-input");
  const gateMsg = document.getElementById("gate-msg");

  function normalizeCode(s) {
    return toHalfWidth(s).trim().toLowerCase().replace(/[\s\-_./]/g, "");
  }

  function unlockSite() {
    sessionStorage.setItem("gw-verified", "1");
    gateWrap.hidden = true;
    app.hidden = false;
    render([]);
  }

  function tryUnlock() {
    const val = normalizeCode(gateInput.value);
    if (val === CODE || val.endsWith(CODE) || val === "gxyx" + CODE) {
      unlockSite();
      return;
    }
    gateAttempts++;
    if (gateAttempts >= 3) {
      gateMsg.innerHTML = `<div class="gate-hint">口令格式通常是「日期 + run」，全部小写、不带分隔符。</div>`;
    } else {
      gateMsg.innerHTML = `<div class="gate-err">口令不正确。</div>`;
    }
  }

  document.getElementById("gate-btn").addEventListener("click", tryUnlock);
  gateInput.addEventListener("keydown", (e) => { if (e.key === "Enter") tryUnlock(); });

  if (sessionStorage.getItem("gw-verified") === "1") {
    unlockSite();
  }
</script>
</body>
</html>
